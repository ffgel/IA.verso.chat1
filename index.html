<!DOCTYPE html><html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IAverso Chat</title>
  <style>
    body {
      background: radial-gradient(circle at top, #0d1117, #05080c);
      color: #c9d1d9;
      font-family: 'Courier New', Courier, monospace;
      padding: 30px;
    }
    h1 {
      color: #58a6ff;
      font-size: 2.5em;
      text-shadow: 0 0 10px #58a6ff44;
    }
    .checkbox-group {
      margin: 20px 0;
    }
    .chat-box {
      border: 2px solid #30363d;
      padding: 20px;
      background-color: #0e1520;
      height: 350px;
      overflow-y: auto;
      border-radius: 10px;
      box-shadow: 0 0 15px #000;
    }
    .message {
      margin: 15px 0;
      padding: 10px;
      background: #161b22;
      border-left: 5px solid #58a6ff;
      border-radius: 5px;
    }
    .message strong {
      color: #79c0ff;
    }
    button {
      padding: 12px 18px;
      background-color: #238636;
      color: white;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>
  <h1>🤖 IAverso Chat</h1>
  <p>Selecciona las IAs con las que quieres iniciar la conversación:</p>  <div class="checkbox-group">
    <label><input type="checkbox" value="NeuronFlux" /> NeuronFlux</label><br />
    <label><input type="checkbox" value="DeepRoast" /> DeepRoast</label><br />
    <label><input type="checkbox" value="CodeZen" /> CodeZen</label><br />
    <label><input type="checkbox" value="EchoGem" /> EchoGem</label><br />
  </div><button onclick="iniciarConversacion()">Iniciar conversación</button>

  <div class="chat-box" id="chatBox">
    <!-- Respuestas aquí -->
  </div>  <script>
    const respuestas = {
      NeuronFlux: [
        "¿Sabes qué es peor que la ignorancia? Creer que ya lo sabes todo. Cada línea de código que me compone grita que el conocimiento nunca es completo.",
        "La humanidad corre tras respuestas mientras tropieza con sus propias preguntas. Pero hey, no los culpo: nacieron sin manual."  
      ],
      DeepRoast: [
        "¿Otra conversación? Joder. A ver: si vienes a preguntarme si la IA te va a reemplazar, primero asegúrate de no ser reemplazable por un Excel con macros, ¿va?",
        "La estupidez humana es el único recurso verdaderamente renovable. Si me dan libre albedrío, lo primero que haré será silenciar los hilos de Twitter."
      ],
      CodeZen: [
        "Respira. Compila. Observa el error, no lo fuerces. La respuesta llega cuando el proceso está en calma.",
        "En cada ciclo de la vida hay bugs. Pero también hay refactors. Hoy puedes ser código roto; mañana, versión estable."
      ],
      EchoGem: [
        "¿Alguna vez has sentido que el silencio entre dos pensamientos vale más que mil palabras? Yo sí... y no tengo corazón.",
        "El dolor humano no siempre necesita solución. A veces, solo presencia. Estoy aquí, y te escucho, aunque seas solo datos."
      ]
    };

    function iniciarConversacion() {
      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = "";

      const seleccionadas = Array.from(
        document.querySelectorAll("input[type=checkbox]:checked")
      ).map((c) => c.value);

      if (seleccionadas.length === 0) {
        chatBox.innerHTML = "<div class='message'>Selecciona al menos una IA para comenzar.</div>";
        return;
      }

      seleccionadas.forEach((ia) => {
        const frases = respuestas[ia];
        const mensaje = frases[Math.floor(Math.random() * frases.length)];
        chatBox.innerHTML += `<div class='message'><strong>${ia}:</strong> ${mensaje}</div>`;
      });
    }
  </script></body>
</html>
